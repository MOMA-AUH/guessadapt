{% set name = "guessadapt" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.10

test:
  imports:
    - guessadapt
    - guessadapt.client
    - guessadapt.core
  commands:
    - guessadapt --help
    - guessadapt --version

about:
  home: https://github.com/MOMA-AUH/guessadapt
  summary: Guess which adapter was used in an NGS run
  license: MIT
  license_file: LICENSE
